[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-context"
version = "0.1.0"
description = "Local code structure for AI coding agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agent-context = "agent_context.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
